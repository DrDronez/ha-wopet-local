name: Wopet Local Bridge
version: 0.2.4
slug: wopet_local_bridge
description: Local TUTK/Kalay to RTSP bridge for supported Wopet cameras
url: https://github.com/DrDronez/ha-wopet-local
arch:
  - amd64
startup: services
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 1985
host_network: true
panel_icon: mdi:cctv
panel_title: Wopet Local
options:
  camera_ip: ""
  device_uid: ""
  device_username: ""
  device_password: ""
  stream_name: wopet
  rtsp_port: 8554
  control_port: 1986
  control_token: ""
  enable_audio: false
  log_level: info
schema:
  camera_ip: str
  device_uid: password
  device_username: password
  device_password: password
  stream_name: match(^[A-Za-z0-9_-]+$)
  rtsp_port: port
  control_port: port
  control_token: password
  enable_audio: bool
  log_level: list(debug|info|warning|error)
