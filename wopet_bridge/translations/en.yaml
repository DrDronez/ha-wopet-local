configuration:
  camera_ip:
    name: Camera IP address
    description: Reserved LAN IP address of the Wopet camera.
  device_uid:
    name: Device UID
    description: TUTK/Kalay device identifier for your camera.
  device_username:
    name: Device username
    description: Camera viewer username, not your Wopet email address.
  device_password:
    name: Device password
    description: Camera viewer password, not your Wopet account password.
  stream_name:
    name: Stream name
    description: RTSP path used by go2rtc.
  rtsp_port:
    name: RTSP port
    description: Host port for the RTSP stream. Choose an unused TCP port.
  control_port:
    name: Control port
    description: Host port used by the authenticated Home Assistant controls.
  control_token:
    name: Control token
    description: A private random token shared only with the Wopet Local integration.
  enable_audio:
    name: Include camera audio
    description: Experimental AAC audio in the Home Assistant stream.
  log_level:
    name: Log level
    description: Use debug only while troubleshooting; network details may appear.
